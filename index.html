<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>米娜的小鎮｜Mina</title>
<meta name="description" content="米娜，數位藝術家。歡迎來到她的小鎮：工作室、公寓大樓的展覽，和可以玩小遊戲的花園。">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500&display=swap" rel="stylesheet">

<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: linear-gradient(#9fbad0 0%, #c2d3df 28%, #dde5e6 46%, #dfe4dd 56%); }
  .site-head { position: fixed; left: 0; right: 0; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .site-foot { display: none; }
  #town { position: fixed; inset: 0; }
  #town canvas { display: block; touch-action: none; }

  /* 地標名牌 */
  .pin {
    position: fixed; left: 0; top: 0; z-index: 5; transform: translate(-50%, -100%);
    background: rgba(244, 242, 238, .92); border: 1px solid var(--line); padding: 8px 14px 9px;
    font: inherit; color: var(--ink); text-align: center; cursor: pointer; white-space: nowrap;
    box-shadow: 0 10px 24px -14px rgba(50, 53, 58, .5); transition: opacity .4s, background .2s;
  }
  .pin::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 1px; height: 7px; background: var(--ink-soft); }
  .pin b { display: block; font-weight: 500; font-size: 14px; letter-spacing: .16em; }
  .pin span { display: block; font-size: 11px; letter-spacing: .14em; color: var(--ink-soft); }
  .pin:hover, .pin.on { background: var(--ink); color: var(--paper); }
  .pin:hover span, .pin.on span { color: #c9c5bd; }
  .pins-hidden .pin { opacity: 0; pointer-events: none; }

  /* 米娜的歡迎對話 */
  #welcome {
    position: fixed; z-index: 15; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px); opacity: 0; width: min(640px, calc(100% - 32px));
    display: grid; grid-template-columns: 76px 1fr; gap: 18px; align-items: start;
    background: rgba(244, 242, 238, .96); border: 1px solid var(--line); padding: 20px 22px 18px;
    box-shadow: 0 24px 60px -24px rgba(50, 53, 58, .55); transition: opacity .7s, transform .7s;
  }
  #panel .howto { margin: 26px 0 4px; padding: 14px 16px; background: #efe9f6; border-left: 3px solid #b7a2d8; }
  #panel .howto b { display: block; font-weight: 500; font-size: 13px; letter-spacing: .16em; color: #6d5a92; }
  #panel .howto p { margin: 6px 0 0; font-size: 13px; line-height: 1.9; }
  #welcome:not(.show) { pointer-events: none; }   /* 關掉後不要擋住一樓的窗戶 */
  #welcome.show { opacity: 1; transform: translate(-50%, 0); }
  #welcome img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; }
  #welcome .who { font-size: 12px; letter-spacing: .28em; color: var(--wine); font-weight: 500; margin-bottom: 4px; }
  #welcome .say { font-size: 17px; line-height: 1.95; min-height: 3.9em; margin: 0; }
  #welcome .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  #welcome .btn { padding: 9px 18px; font-size: 13px; }
  #welcome .skip { margin-left: auto; background: none; border: 0; font: inherit; font-size: 12px; letter-spacing: .14em; color: var(--ink-soft); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
  #welcome .dots { font-size: 11px; color: var(--ink-soft); letter-spacing: .3em; }
  @media (max-width: 560px) {
    #welcome { grid-template-columns: 52px 1fr; gap: 12px; padding: 16px; }
    #welcome img { width: 52px; height: 52px; }
    #welcome .say { font-size: 15px; }
  }

  /* 區域說明 */
  #panel {
    position: fixed; z-index: 12; top: 0; right: 0; bottom: 0; width: min(420px, 100%);
    background: rgba(244, 242, 238, .97); border-left: 1px solid var(--line);
    padding: 88px 36px calc(36px + env(safe-area-inset-bottom)); overflow: auto;
    transform: translateX(105%); transition: transform .6s cubic-bezier(.2, .7, .2, 1);
  }
  #panel.open { transform: none; }
  #panel h2 { font-size: 26px; margin-bottom: 18px; }
  #panel .close-panel { position: absolute; top: 76px; right: 20px; background: none; border: 0; font-size: 26px; color: var(--ink); cursor: pointer; line-height: 1; padding: 8px; }
  #panel img.cover { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; margin: 0 0 24px; }
  #panel .btns { flex-direction: column; align-items: stretch; }
  #panel .btn { justify-content: center; }
  @media (max-width: 720px) {
    #panel { top: auto; height: min(56svh, 520px); width: 100%; border-left: 0; border-top: 1px solid var(--line); padding: 32px 22px calc(28px + env(safe-area-inset-bottom)); transform: translateY(105%); }
    #panel .close-panel { top: 12px; right: 12px; }
    #panel img.cover { aspect-ratio: 16 / 9; }
  }

  .hint { position: fixed; z-index: 4; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); text-align: center; font-size: 12px; letter-spacing: .16em; color: var(--ink-soft); pointer-events: none; transition: opacity .6s; }
  .mode { position: fixed; z-index: 6; right: var(--gutter); bottom: calc(14px + env(safe-area-inset-bottom)); background: rgba(244, 242, 238, .92); border: 1px solid var(--line); padding: 8px 16px; font: inherit; font-size: 12px; letter-spacing: .14em; color: var(--ink); cursor: pointer; }
  .mode:hover { background: var(--ink); color: var(--paper); }
  body.night .site-head nav a, body.night .site-head .menu-btn, body.night .hint { color: #ece9e3; }
  .again { position: fixed; z-index: 6; left: var(--gutter); bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; background: rgba(244, 242, 238, .92); border: 1px solid var(--line); padding: 6px 14px 6px 6px; font: inherit; font-size: 12px; letter-spacing: .14em; color: var(--ink); cursor: pointer; }
  .again img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
  .again[hidden] { display: none; }
  @media (max-width: 720px) { .hint { display: none; } .pin { padding: 6px 10px 7px; } .pin b { font-size: 13px; letter-spacing: .1em; } .pin span { font-size: 10px; letter-spacing: .06em; } }

  /* 屋頂影片 */
  #roofv { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(50, 53, 58, .6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #roofv.open { display: flex; }
  #roofv .box { background: var(--paper); display: grid; grid-template-columns: auto minmax(220px, 300px); max-height: 100%; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  #roofv video { height: min(84vh, 860px); aspect-ratio: 9 / 16; object-fit: cover; display: block; background: #ddd; }
  #roofv .txt { padding: 32px 26px; display: flex; flex-direction: column; gap: 10px; }
  #roofv .tabs { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
  #roofv .tabs button { text-align: left; }
  #roofv .tabs button.on { background: var(--ink); color: var(--paper); }
  #roofv .x { position: fixed; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--paper); font-size: 20px; cursor: pointer; }
  @media (max-width: 680px) {
    #roofv .box { grid-template-columns: 1fr; width: 100%; overflow: auto; }
    #roofv video { height: 58vh; width: 100%; object-fit: contain; }
    #roofv .txt { padding: 18px; }
    #roofv .tabs { flex-direction: row; flex-wrap: wrap; }
  }
  #fallback { display: none; position: fixed; inset: 0; overflow: auto; padding: 96px var(--gutter) 40px; }
  .no-webgl #fallback { display: block; }
  .no-webgl #town, .no-webgl .hint, .no-webgl .zoombar { display: none; }
  /* 放大／縮小／回到全景 */
  .zoombar { position: fixed; z-index: 6; right: var(--gutter); bottom: calc(62px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; background: rgba(244, 242, 238, .92); border: 1px solid var(--line); }
  .zoombar button { font: inherit; width: 44px; height: 40px; background: none; border: 0; color: var(--ink); cursor: pointer; font-size: 16px; }
  .zoombar button + button { border-top: 1px solid var(--line); }
  .zoombar button[data-z="home"] { font-size: 11px; letter-spacing: .08em; }
  .zoombar button:hover { background: #ece4f6; }
  body.panel-open .zoombar { right: calc(var(--gutter) + min(420px, 100vw)); }
  @media (max-width: 720px) { .zoombar { bottom: calc(60px + env(safe-area-inset-bottom)); } body.panel-open .zoombar { display: none; } }
</style>
</head>

    <p class="lead">想去哪裡都可以。</p>
    <div class="cards" style="margin-top:32px">
      <a class="card" href="about.html" style="text-decoration:none"><p class="tag">工作室</p><h3>認識米娜</h3></a>
      <a class="card" href="exhibition.html" style="text-decoration:none"><p class="tag">公寓大樓</p><h3>今日展覽《學習彼此的語言》</h3></a>
      <a class="card" href="game.html" style="text-decoration:none"><p class="tag">花園</p><h3>猜猜看：人還是 AI？</h3></a>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = id => document.getElementById(id);
const B = window.BUILDING;
// 大樓每一戶的台詞與作品說明（點窗戶直接看那一戶）
{ const ds = document.createElement("script"); ds.src = B + "data.js"; document.body.append(ds); }

/* ---------- 三個區域的內容 ---------- */
const ZONES = {
  studio: {
    name: "米娜的工作室", sub: "認識米娜・和米娜聊聊",
    html: `<p class="eyebrow">STUDIO</p><h2>米娜的工作室</h2>
      <img class="cover" src="assets/img/studio-morning.jpg" alt="清晨窗邊，米娜在畫大樓的草稿">
      <p class="lead">這是我每天畫畫的地方。</p>
      <p class="soft">桌上攤著大樓的草稿，牆上釘著已經蓋好的樓層。進來坐坐，看看我是誰、我怎麼畫。</p>
      <div class="btns"><a class="btn solid" href="about.html">認識米娜</a><button class="btn" disabled>和米娜聊聊（即將開放）</button></div>`,
  },
  building: {
    name: "公寓大樓", sub: "今日展覽《學習彼此的語言》",
    html: `<p class="eyebrow">EXHIBITION No.01</p><h2>學習彼此的語言</h2>
      <p class="soft small">作品 No.01《人類與 AI 的公寓大樓》・2026</p>
      <p class="lead">一棟人和 AI 一起住的公寓。</p>
      <p>十層樓，每一層是一個藝術流派：從一樓中世紀的彩色玻璃，蓋到十樓電腦畫出來的線。往上走，是八百年的藝術史；也是人和 AI 從陌生、試探、交換、不安，到一起生活的路。</p>
      <p class="soft">我不說 AI 好，也不說 AI 壞。人和 AI 正在學習彼此的語言，這棟樓記下了學的過程。</p>
      <div class="howto"><b>怎麼看作品</b><p>想看哪一戶，就直接點大樓上那一扇窗。<br>滑鼠移過去窗戶會亮，點下去就打開那一戶的作品。</p></div>
      <div class="btns"><a class="btn solid" href="exhibition.html">策展導覽：一層一層走</a><button class="btn" data-roof="L">看屋頂的三支影片</button></div>`,
  },
  garden: {
    name: "花園", sub: "猜猜看小遊戲",
    html: `<p class="eyebrow">GARDEN</p><h2>噴水池旁的小遊戲</h2>
      <p class="lead">這句話，是人說的，還是 AI？</p>
      <p class="soft">大樓每一層挑一句，一共十句。有些真的分不出來。猜完，可以直接走到那一戶去看看。</p>
      <div class="btns"><a class="btn solid" href="game.html">坐下來玩一局</a></div>`,
  },
};

/* ---------- WebGL 檢查 ---------- */
const probe = document.createElement("canvas");
if (!(probe.getContext("webgl2") || probe.getContext("webgl"))) {
  document.documentElement.classList.add("no-webgl");
  throw new Error("no webgl");
}

/* ---------- 場景 ---------- */
const host = $("town");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe4dd, 60, 175);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
// 手掌模式：左鍵（單指）拖曳＝移動畫面；右鍵（雙指）＝轉動；滾輪（雙指捏）＝往滑鼠指的地方放大
controls.enablePan = true; controls.screenSpacePanning = true; controls.zoomToCursor = true;
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };
controls.minPolarAngle = Math.PI * 0.2; controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 5; controls.maxDistance = 95;
// 不讓畫面被拖到小鎮外面去
const PAN_MIN = new THREE.Vector3(-45, 0, -35), PAN_MAX = new THREE.Vector3(45, 34, 45), panFix = new THREE.Vector3();
controls.addEventListener("change", () => {
  panFix.copy(controls.target).clamp(PAN_MIN, PAN_MAX).sub(controls.target);
  if (panFix.lengthSq()) { controls.target.add(panFix); camera.position.add(panFix); }
});

const hemi = new THREE.HemisphereLight(0xf3efe8, 0xb9b3a8, 1.25); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e2, 2.1);
sun.position.set(-22, 34, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 34, bottom: -20, near: 1, far: 100 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);

const loader = new THREE.TextureLoader();
const tex = (url, rep) => {
  const t = loader.load(url); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); }
  return t;
};
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .92, metalness: 0, ...o });
function box(w, h, d, m, x, y, z, parent = scene) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true; parent.add(mesh); return mesh;
}
function cyl(rt, rb, h, m, x, y, z, seg = 40, parent = scene) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true; parent.add(mesh); return mesh;
}

const C = { lime: 0xeeebe5, stone: 0xd9d3c9, path: 0xe8e3da, ground: 0xd2d6c2, grass: 0xbcc4a9, sage: 0x9fa894, sage2: 0x8b9784, roof: 0x5d6570, wine: 0x6e3a44, sand: 0xd9c7a8, mist: 0x8a9aa8, ink: 0x32353a, wood: 0x8d7a66 };

/* 地面、小路、草地 */
const ground = new THREE.Mesh(new THREE.CircleGeometry(220, 96), mat(C.ground));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
function flat(geo, color, x, z, y = 0.01, rot = 0) {
  const m = new THREE.Mesh(geo, mat(color)); m.rotation.x = -Math.PI / 2; m.rotation.z = rot;
  m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m;
}
flat(new THREE.CircleGeometry(5.2, 64), C.path, 0, 9);                 // 小廣場
flat(new THREE.PlaneGeometry(2.4, 16), C.path, 0, 18);                 // 往鏡頭的路
flat(new THREE.PlaneGeometry(2, 9), C.path, -7.5, 7.5, 0.012, -0.95);  // 往工作室
flat(new THREE.PlaneGeometry(2, 9), C.path, 7.5, 7.5, 0.012, 0.95);    // 往花園
flat(new THREE.PlaneGeometry(2.2, 4), C.path, 0, 3.6, 0.012);          // 往大樓
flat(new THREE.CircleGeometry(8.5, 64), C.grass, 13.5, 6, 0.008);      // 花園草地
flat(new THREE.CircleGeometry(6.5, 64), C.grass, -14, 6.5, 0.008);     // 工作室前院
flat(new THREE.CircleGeometry(5, 48), C.grass, -6, -6, 0.008);
flat(new THREE.CircleGeometry(5, 48), C.grass, 7, -6.5, 0.008);

/* ---------- 公寓大樓（作品 No.01） ---------- */
const building = new THREE.Group(); scene.add(building);
const BW = 5.4, BH = BW * 3200 / 720, BD = 3.6, FH = BH / 10;
// 每層窗內主色（系列企劃：1F 霧藍…10F 米白）與背面導覽牆文字
const FLOOR_COLOR = ["#9fb0bf", "#e3d6bf", "#c9b39a", "#a7b0b8", "#e2d5ab", "#8f8098", "#8a5560", "#95a7b6", "#b8b8b6", "#efe9dc"];
const FLOOR_INFO = [["中世紀彩色玻璃", "陌生"], ["文藝復興", "陌生"], ["荷蘭黃金時代", "試探"], ["浮世繪", "試探"], ["印象派", "交換"],
  ["新藝術運動", "交換"], ["表現主義", "不安"], ["超現實主義", "化解"], ["包浩斯", "新的方向"], ["數位生成藝術", "共存"]];
function wallTexture(cols, plaque) {
  const cw = 240, ch = 320, cv = document.createElement("canvas");
  cv.width = cw * cols; cv.height = ch * 10;
  const g = cv.getContext("2d");
  const draw = () => {
    g.fillStyle = "#f1eee8"; g.fillRect(0, 0, cv.width, cv.height);
    for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(120,110,95,${Math.random() * .05})`; g.fillRect(Math.random() * cv.width, Math.random() * cv.height, 2, 2); }
    for (let f = 0; f < 10; f++) {
      const y0 = (9 - f) * ch, fc = FLOOR_COLOR[f];
      g.fillStyle = "#ddd6cb"; g.fillRect(0, y0, cv.width, 10);                       // 腰線
      g.fillStyle = "rgba(0,0,0,.05)"; g.fillRect(0, y0 + 10, cv.width, 4);
      for (let c = 0; c < cols; c++) {

  "嗨，歡迎來到我的小鎮。我是米娜。",
  "今天的展覽叫《學習彼此的語言》。",
  "我蓋了一棟樓，讓人和 AI 當鄰居。十層樓，十個藝術流派，從中世紀一路蓋到現在。",
  "我不說 AI 好，也不說 AI 壞。人和 AI 都在學彼此的語言：會誤會，會不安，也會慢慢靠近。",
  "想去哪裡都可以。來我的工作室坐坐、走進大樓看展，或去花園玩個小遊戲。",
];
let li = 0, typing = null;
function type(text) {
  clearInterval(typing); const el = $("say"); el.textContent = ""; let i = 0;
  typing = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(typing); }, 45);
}
function renderStep() {
  type(LINES[li]);
  const last = li === LINES.length - 1;
  $("row").innerHTML = last
    ? `<button class="btn solid" data-go="studio">去工作室</button><button class="btn solid" data-go="building">看展覽</button><button class="btn solid" data-go="garden">去花園</button><button class="skip" data-close>自己逛逛</button>`
    : `<button class="btn" data-next>${li === 0 ? "你好" : "然後呢"}</button><span class="dots">${"●".repeat(li + 1)}${"○".repeat(LINES.length - li - 1)}</span><button class="skip" data-close>略過</button>`;
  if (li === 2) { Object.values(pins).forEach(p => p.classList.remove("on")); pins.building.classList.add("on"); }
  if (li === 4) pins.building.classList.remove("on");
}
$("row").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.next !== undefined) { li++; renderStep(); }
  else if (b.dataset.go) go(b.dataset.go);
  else if (b.dataset.close !== undefined) closeWelcome(true);
});
function openWelcome() { li = 0; renderStep(); $("welcome").classList.add("show"); $("again").hidden = true; }
function closeWelcome(showHint) {
  $("welcome").classList.remove("show"); $("again").hidden = false;
  clearInterval(typing);
  if (showHint) $("hint").style.opacity = 1;
}
$("again").onclick = () => { if (current) back(); openWelcome(); };
$("hint").style.opacity = 0;
setTimeout(openWelcome, 2200);
if (new URLSearchParams(location.search).has("debug")) window.__town = { scene, camera, controls, go };
</script>
</body>
</html>
